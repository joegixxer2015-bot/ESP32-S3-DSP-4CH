Name: PlatformIO Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO and Esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Build Project
        run: pio run -d .

      - name: Merge Binaries to Single File
        run: |
          BUILD_DIR=$(ls -d .pio/build/* | head -n 1)
          esptool.py --chip esp32s3 merge_bin \
            -o $BUILD_DIR/merged.bin \
            0x0 $BUILD_DIR/bootloader.bin \
            0x8000 $BUILD_DIR/partitions.bin \
            0x10000 $BUILD_DIR/firmware.bin

      - name: Upload Merged Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-dsp-merged-firmware
          path: .pio/build/**/merged.bin
